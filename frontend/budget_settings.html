<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Settings - BudgetSense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --budget-purple: #7047EB; --budget-purple-hover: #5A35C5; --budget-bg-light: #F8F9FA; }
        body { background-color: var(--budget-bg-light); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: var(--budget-purple) !important; box-shadow: 0 4px 12px rgba(112, 71, 235, 0.1); }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        .btn-primary { background-color: var(--budget-purple); border-color: var(--budget-purple); }
        .btn-primary:hover { background-color: var(--budget-purple-hover); border-color: var(--budget-purple-hover); }
        .budget-icon { font-size: 1.5rem; color: var(--budget-purple); margin-right: 15px; }
        .text-danger-custom { color: #dc3545 !important; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">BudgetSense</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/history">History</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/budgets">Budgets</a></li>
                    <li class="nav-item ms-lg-3">
                        <a href="/login" class="btn btn-sm btn-outline-light px-3 fw-bold" style="border-radius: 20px;" onclick="localStorage.clear()">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h3 class="fw-bold mb-4" style="color: #333;">Budget Settings</h3>
        <div class="row">
            <div class="col-md-5 mb-4">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3">Monthly Income</h5>
                    <p class="text-muted small">Set your total income to calculate remaining balance.</p>
                    <form id="income-form">
                        <div class="mb-3">
                            <label class="form-label">Total Monthly Income (Rs.)</label>
                            <input type="number" id="monthly-income" class="form-control form-control-lg" placeholder="Loading..." required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Update Income</button>
                    </form>
                </div>
            </div>

            <div class="col-md-7 mb-4">
                <div class="card p-4">
                    <h5 class="fw-bold mb-4">
                        Category Limits
                        <span id="allocation-status" class="fs-6 fw-normal float-end text-muted"></span>
                    </h5>
                    
                    <div id="category-limits-container">
                        <p class="text-muted text-center py-3">Loading category budgets...</p>
                    </div>
                    
                    <div id="add-budget-form" class="mt-4 p-3 bg-light rounded border d-none">
                        <h6 class="fw-bold mb-3">Add New Limit</h6>
                        <select id="new-category-select" class="form-select mb-2">
                            <option value="" disabled selected>Select a Category...</option>
                            <option value="Food">Food</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Dining">Dining</option>
                            <option value="Transport">Transport</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Education">Education</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Sports">Sports</option>
                            <option value="Travel">Travel</option>
                            <option value="Other">Other</option>
                        </select>
                        <input type="number" id="new-limit-input" class="form-control mb-3" placeholder="Enter budget limit (Rs.)">
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-primary w-100 fw-bold" onclick="saveNewCategory()">Save</button>
                            <button class="btn btn-sm btn-outline-secondary w-100 fw-bold" onclick="toggleAddForm()">Cancel</button>
                        </div>
                    </div>

                    <button id="btn-show-add" type="button" class="btn btn-primary w-100 fw-bold mt-3" onclick="toggleAddForm()">+ Add New Category Budget</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const categoryIcons = { 'Food': '🍔', 'Groceries': '🛒', 'Dining': '🍽️', 'Transport': '🚗', 'Shopping': '🛍️', 'Utilities': '💡', 'Entertainment': '🎬', 'Healthcare': '🏥', 'Education': '📚', 'Sports': '⚽', 'Travel': '✈️', 'Other': '📦' };

        // Global variables to track income vs allocated budgets
        let globalTotalIncome = 0;
        let globalTotalAllocated = 0;

        async function loadBudgetData() {
            const userId = localStorage.getItem('user_id');
            const token = localStorage.getItem('access_token');
            if (!userId || !token) { window.location.href = '/login'; return; }

            try {
                const profileRes = await fetch('/api/auth/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (profileRes.ok) {
                    const profileData = await profileRes.json();
                    globalTotalIncome = profileData.user.monthly_income || 0;
                    document.getElementById('monthly-income').value = globalTotalIncome;
                }

                const budgetRes = await fetch(`/api/budgets?user_id=${userId}`);
                if (!budgetRes.ok) return;
                const data = await budgetRes.json();

                const container = document.getElementById('category-limits-container');
                container.innerHTML = '';
                globalTotalAllocated = 0;

                if (data.budgets && data.budgets.length > 0) {
                    data.budgets.forEach(cat => {
                        globalTotalAllocated += Number(cat.limit);
                        const icon = categoryIcons[cat.category] || '💰';
                        container.innerHTML += `
                            <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                                <div class="d-flex align-items-center">
                                    <div class="budget-icon">${icon}</div>
                                    <div>
                                        <h6 class="mb-0 fw-bold">${cat.category}</h6>
                                        <small class="text-muted">Limit: Rs. ${Number(cat.limit).toLocaleString()} | Spent: Rs. ${cat.spent}</small>
                                    </div>
                                </div>
                                <button class="btn btn-outline-primary btn-sm px-3" onclick="editCategoryLimit('${cat._id}', '${cat.category}', ${cat.limit})">Edit</button>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `<p class="text-muted text-center py-3">No category budgets set yet.</p>`;
                }

                // Update the visual allocation tracker
                const statusText = document.getElementById('allocation-status');
                if (globalTotalIncome > 0) {
                    statusText.innerHTML = `Allocated: <strong>Rs. ${globalTotalAllocated.toLocaleString()}</strong> / Rs. ${globalTotalIncome.toLocaleString()}`;
                    if (globalTotalAllocated > globalTotalIncome) {
                        statusText.classList.add('text-danger-custom');
                    } else {
                        statusText.classList.remove('text-danger-custom');
                    }
                } else {
                    statusText.innerText = 'Please set your income first.';
                }

            } catch (error) { console.error('Error:', error); }
        }

        document.getElementById('income-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const token = localStorage.getItem('access_token');
            const incomeValue = document.getElementById('monthly-income').value;

            try {
                const response = await fetch('/api/auth/profile', {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ monthly_income: Number(incomeValue) })
                });
                
                const data = await response.json();
                if (response.ok) {
                    alert('Income updated successfully!');
                    loadBudgetData(); 
                } else {
                    alert(data.error || 'Failed to update income. Token may be expired.');
                }
            } catch (error) { console.error('Error:', error); }
        });

        async function editCategoryLimit(budgetId, categoryName, currentLimit) {
            const newLimit = prompt(`Enter new limit for ${categoryName} (Numbers only):`, currentLimit);
            if (newLimit === null || newLimit.trim() === '') return;
            const limitNum = Number(newLimit);

            // VALIDATION: Check if editing this pushes them over their total income
            if (globalTotalIncome > 0) {
                const newTotal = globalTotalAllocated - currentLimit + limitNum;
                if (newTotal > globalTotalIncome) {
                    alert(`Cannot update: This exceeds your monthly income. You only have Rs. ${(globalTotalIncome - (globalTotalAllocated - currentLimit)).toLocaleString()} left to allocate to this category.`);
                    return;
                }
            }

            const userId = localStorage.getItem('user_id');
            try {
                const response = await fetch(`/api/budgets/${budgetId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, limit: limitNum })
                });

                if (response.ok) { loadBudgetData(); } 
                else { 
                    const data = await response.json();
                    alert(data.error || 'Failed to update limit.'); 
                }
            } catch (error) { console.error('Error:', error); }
        }

        function toggleAddForm() {
            const form = document.getElementById('add-budget-form');
            const btn = document.getElementById('btn-show-add');
            if (form.classList.contains('d-none')) {
                form.classList.remove('d-none');
                btn.classList.add('d-none');
            } else {
                form.classList.add('d-none');
                btn.classList.remove('d-none');
                document.getElementById('new-category-select').value = "";
                document.getElementById('new-limit-input').value = "";
            }
        }

        async function saveNewCategory() {
            const categoryName = document.getElementById('new-category-select').value;
            const limit = document.getElementById('new-limit-input').value;

            if (!categoryName) { alert("Please select a category."); return; }
            if (!limit || Number(limit) <= 0) { alert("Please enter a valid limit greater than 0."); return; }

            const limitNum = Number(limit);

            // VALIDATION: Check if adding this pushes them over their total income
            if (globalTotalIncome <= 0) {
                alert("Please set your Monthly Income first before adding category limits.");
                return;
            }
            if (globalTotalAllocated + limitNum > globalTotalIncome) {
                alert(`Cannot add budget: This exceeds your monthly income. You only have Rs. ${(globalTotalIncome - globalTotalAllocated).toLocaleString()} left to allocate.`);
                return;
            }

            const userId = localStorage.getItem('user_id');
            try {
                const response = await fetch('/api/budgets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, category: categoryName, limit: limitNum })
                });

                if (response.ok) { 
                    toggleAddForm();
                    loadBudgetData(); 
                } else { 
                    const err = await response.json();
                    alert(err.error || 'Failed to create budget limit.'); 
                }
            } catch (error) { console.error('Error:', error); }
        }

        window.onload = loadBudgetData;
    </script>
</body>
</html>

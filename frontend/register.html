<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BudgetSense</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --budget-purple: #7047EB;       
            --budget-purple-hover: #5A35C5; 
            --budget-bg-light: #F8F9FA;     
        }
        
        body {
            background-color: var(--budget-bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background-color: var(--budget-purple) !important;
            box-shadow: 0 4px 12px rgba(112, 71, 235, 0.1);
        }

        .text-primary {
            color: var(--budget-purple) !important;
        }

        .btn-primary {
            background-color: var(--budget-purple);
            border-color: var(--budget-purple);
        }
        .btn-primary:hover {
            background-color: var(--budget-purple-hover);
            border-color: var(--budget-purple-hover);
        }

        .card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }

        .form-control:focus {
            border-color: var(--budget-purple);
            box-shadow: 0 0 0 0.25rem rgba(112, 71, 235, 0.25);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">BudgetSense</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center mt-4">
            <div class="col-md-6">
                <div class="card p-2">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 fw-bold text-primary">Create Account</h3>
                        
                        <!-- FIX 1: Added id="register-form" -->
                        <form id="register-form">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <!-- FIX 2: Added id="name" -->
                                <input type="text" id="name" class="form-control" placeholder="e.g. Haleema Zafar" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email address</label>
                                <!-- FIX 3: Added id="email" -->
                                <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <!-- FIX 4: Added id="password" -->
                                <input type="password" id="password" class="form-control" placeholder="Create a strong password" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Confirm Password</label>
                                <!-- FIX 5: Added id="confirm-password" -->
                                <input type="password" id="confirm-password" class="form-control" placeholder="Repeat password" required>
                            </div>

                            <div class="d-grid">
                                <!-- FIX 6: Changed type to "submit" -->
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Sign Up</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="text-muted">Already have an account? <a href="/login" class="text-primary text-decoration-none fw-bold">Login here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Handling Registration API Request -->
    <script>
        async function handleRegister(event) {
            event.preventDefault(); // Stop standard form page reload

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Client-side verification to match both input passwords
            if (password !== confirmPassword) {
                alert("Passwords do not match! Please check again.");
                return;
            }

            const url = '/api/auth/register';

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Account successfully created! Redirecting to login page...');
                    window.location.href = '/login'; // Forward user to login page
                } else {
                    // Pulls backend validation message (e.g., "Email already registered")
                    alert(data.error || 'Registration failed. Please check your details.');
                }

            } catch (error) {
                console.error('Registration Error:', error);
                alert('Backend connection error. Make sure your server is running.');
            }
        }

        // Attach event listener to form submission event
        document.getElementById('register-form').addEventListener('submit', handleRegister);
    </script>

</body>
</html>

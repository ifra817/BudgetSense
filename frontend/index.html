<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to BudgetSense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --budget-purple: #7047EB; --budget-bg-light: #F8F9FA; }
        body { background-color: var(--budget-bg-light); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .hero-section { text-align: center; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .btn-purple { background-color: var(--budget-purple); color: white; border-radius: 10px; padding: 12px 30px; font-weight: bold; }
        .btn-purple:hover { background-color: #5A35C5; color: white; }
    </style>
</head>
<body>
    <div class="hero-section col-md-6">
        <h1 class="fw-bold mb-3" style="color: var(--budget-purple);">BudgetSense</h1>
        <p class="text-muted mb-5">Smart Receipt Scanning & Expense Tracking made simple.</p>
        <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
            <a href="login.html" class="btn btn-purple btn-lg">Login</a>
            <a href="register.html" class="btn btn-outline-secondary btn-lg" style="border-radius: 10px;">Register</a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Settings - BudgetSense</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --budget-purple: #7047EB;       
            --budget-purple-hover: #5A35C5; 
            --budget-bg-light: #F8F9FA;     
        }
        
        body {
            background-color: var(--budget-bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background-color: var(--budget-purple) !important;
            box-shadow: 0 4px 12px rgba(112, 71, 235, 0.1);
        }

        .card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .btn-primary {
            background-color: var(--budget-purple);
            border-color: var(--budget-purple);
        }
        .btn-primary:hover {
            background-color: var(--budget-purple-hover);
            border-color: var(--budget-purple-hover);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--budget-purple);
            box-shadow: 0 0 0 0.25rem rgba(112, 71, 235, 0.25);
        }

        .budget-icon {
            font-size: 1.5rem;
            color: var(--budget-purple);
            margin-right: 15px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">BudgetSense</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/history">History</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/budgets">Budgets</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h3 class="fw-bold mb-4" style="color: #333;">Budget Settings</h3>

        <div class="row">
            <div class="col-md-5 mb-4">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3">Monthly Income</h5>
                    <p class="text-muted small">Set your total income to calculate remaining balance.</p>
                    <form id="income-form">
                        <div class="mb-3">
                            <label class="form-label">Total Monthly Income (Rs.)</label>
                            <input type="number" id="monthly-income" class="form-control form-control-lg" placeholder="Loading..." required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Update Income</button>
                    </form>
                </div>
            </div>

            <div class="col-md-7 mb-4">
                <div class="card p-4">
                    <h5 class="fw-bold mb-4">Category Limits</h5>
                    
                    <div id="category-limits-container">
                        <p class="text-muted text-center py-3">Loading category budgets...</p>
                    </div>

                    <div class="mt-4">
                        <button type="button" class="btn btn-primary w-100 fw-bold" onclick="promptAddNewCategory()">+ Add New Category Budget</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Category icons mapper based on name
        const categoryIcons = {
            'Food': '🍔',
            'Transport': '🚗',
            'Shopping': '🛍️',
            'Bills': '💵',
            'Entertainment': '🎬'
        };

        // 1. Page load par data fetch karna
        async function loadBudgetData() {
            const userId = localStorage.getItem('user_id');
            if (!userId) {
                window.location.href = '/login';
                return;
            }

            try {
                const response = await fetch(`/api/budget?user_id=${userId}`);
                if (!response.ok) return;

                const data = await response.json();

                // Income input field value set karna
                document.getElementById('monthly-income').value = data.monthly_income || 0;

                // Category limits list populate karna
                const container = document.getElementById('category-limits-container');
                container.innerHTML = '';

                if (data.categories && data.categories.length > 0) {
                    data.categories.forEach(cat => {
                        const icon = categoryIcons[cat.name] || '💰';
                        container.innerHTML += `
                            <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                                <div class="d-flex align-items-center">
                                    <div class="budget-icon">${icon}</div>
                                    <div>
                                        <h6 class="mb-0 fw-bold">${cat.name}</h6>
                                        <small class="text-muted">Limit: Rs. ${Number(cat.limit).toLocaleString()}</small>
                                    </div>
                                </div>
                                <button class="btn btn-outline-primary btn-sm px-3" onclick="editCategoryLimit('${cat.name}', ${cat.limit})">Edit</button>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `<p class="text-muted text-center py-3">No category budgets set yet.</p>`;
                }

            } catch (error) {
                console.error('Error loading budget settings:', error);
            }
        }

        // 2. Total Income Form Submit handler
        document.getElementById('income-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const userId = localStorage.getItem('user_id');
            const incomeValue = document.getElementById('monthly-income').value;

            try {
                const response = await fetch('/api/budget/update_income', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, monthly_income: Number(incomeValue) })
                });

                const data = await response.json();
                if (response.ok) {
                    alert('Income updated successfully!');
                    loadBudgetData(); // Refresh page data
                } else {
                    alert(data.message || 'Failed to update income.');
                }
            } catch (error) {
                console.error('Error updating income:', error);
            }
        });

        // 3. Category Edit Handler
        async function editCategoryLimit(categoryName, currentLimit) {
            const newLimit = prompt(`Enter new budget limit for ${categoryName}:`, currentLimit);
            if (newLimit === null || newLimit === '') return;

            await saveCategoryBudget(categoryName, Number(newLimit));
        }

        // 4. New Category Add Prompt
        async function promptAddNewCategory() {
            const categoryName = prompt("Enter category name (e.g., Bills, Entertainment):");
            if (!categoryName) return;
            const limit = prompt(`Enter budget limit for ${categoryName}:`);
            if (!limit) return;

            await saveCategoryBudget(categoryName, Number(limit));
        }

        // 5. Shared function to hit API for category updates
        async function saveCategoryBudget(name, limit) {
            const userId = localStorage.getItem('user_id');
            try {
                const response = await fetch('/api/budget/update_category', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, category_name: name, limit: limit })
                });

                const data = await response.json();
                if (response.ok) {
                    alert('Category budget updated successfully!');
                    loadBudgetData();
                } else {
                    alert(data.message || 'Failed to save category limit.');
                }
            } catch (error) {
                console.error('Error updating category limit:', error);
            }
        }

        // Initialize view on load
        window.onload = loadBudgetData;
    </script>
</body>
</html>

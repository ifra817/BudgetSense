<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BudgetSense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --budget-purple: #7047EB;       
            --budget-purple-hover: #5A35C5; 
            --budget-bg-light: #F8F9FA;     
            --budget-danger: #ff4d4f;       
            --budget-success: #28a745;      
        }
        body { background-color: var(--budget-bg-light); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: var(--budget-purple) !important; box-shadow: 0 4px 12px rgba(112, 71, 235, 0.1); }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.04); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .text-primary-custom { color: var(--budget-purple); }
        .alert-danger { background-color: #fff1f0; border-color: var(--budget-danger); color: var(--budget-danger); border-radius: 8px; }
    </style>
</head>
<body>
   <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">BudgetSense</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link active" href="/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/history">History</a></li>
                <li class="nav-item"><a class="nav-link" href="/budgets">Budgets</a></li>
                <li class="nav-item ms-lg-3">
                    <a href="/login" class="btn btn-sm btn-outline-light px-3 fw-bold" style="border-radius: 20px;">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

    <div class="container">
        <div id="budget-alert" class="alert alert-danger alert-dismissible fade show fw-bold d-none" role="alert">
            <span id="alert-message">⚠️ Alert: You have exceeded your budget!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <h3 class="fw-bold mb-4" style="color: #333;">Overview</h3>

        <div class="row mb-4">
            <div class="col-md-3 mb-3">
                <div class="card p-3">
                    <h6 class="text-muted text-uppercase fw-bold mb-1">Total Spent</h6>
                    <h3 id="total-spent" class="fw-bold text-primary-custom">Rs. 0</h3>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card p-3">
                    <h6 class="text-muted text-uppercase fw-bold mb-1">Exceeded Budgets</h6>
                    <h3 id="remaining-budget" class="fw-bold" style="color: var(--budget-danger);">0</h3>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card p-3">
                    <h6 class="text-muted text-uppercase fw-bold mb-1">Total Expenses</h6>
                    <h3 id="receipts-count" class="fw-bold text-dark">0</h3>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card p-3">
                    <h6 class="text-muted text-uppercase fw-bold mb-1">Top Category</h6>
                    <h3 id="top-category" class="fw-bold text-danger">-</h3>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8 mb-4">
                <div class="card p-4 h-100">
                    <h5 class="fw-bold mb-4">Category-Wise Spending</h5>
                    <canvas id="expenseChart" height="100"></canvas>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card p-4 h-100">
                    <h5 class="fw-bold mb-4">Recent Expenses</h5>
                    <ul id="recent-expenses-list" class="list-group list-group-flush">
                        <li class="text-muted text-center py-3">Loading recent expenses...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
        
    <script>
        const ctx = document.getElementById('expenseChart').getContext('2d');
        let expenseChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Spent Amount (Rs.)',
                    data: [],
                    backgroundColor: ['#7047EB', '#ff6b6b', '#4ecdc4', '#feca57', '#ff9ff3'],
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false } } }
            }
        });

        async function loadDashboardData() {
            const userId = localStorage.getItem('user_id');
            if (!userId) {
                window.location.href = '/login';
                return;
            }

            try {
                // Fetch the correct analytics dashboard route
                const dashResponse = await fetch(`/api/analytics/dashboard?user_id=${userId}`);
                // Fetch recent history for the sidebar list
                const histResponse = await fetch(`/api/analytics/history?user_id=${userId}&per_page=5`);
                
                if (!dashResponse.ok || !histResponse.ok) return; 
                
                const dashData = await dashResponse.json();
                const histData = await histResponse.json();
                const dashboard = dashData.dashboard;

                document.getElementById('total-spent').innerText = `Rs. ${dashboard.monthly_summary.total_spent.toLocaleString()}`;
                document.getElementById('remaining-budget').innerText = dashboard.budget_status.exceeded_count;
                document.getElementById('receipts-count').innerText = dashboard.monthly_summary.expense_count;
                
                const topCat = dashboard.top_categories.length > 0 ? dashboard.top_categories[0].category : 'None';
                document.getElementById('top-category').innerText = topCat;

                if (dashboard.top_categories.length > 0) {
                    expenseChart.data.labels = dashboard.top_categories.map(c => c.category); 
                    expenseChart.data.datasets[0].data = dashboard.top_categories.map(c => c.amount); 
                    expenseChart.update();
                }

                const expensesList = document.getElementById('recent-expenses-list');
                expensesList.innerHTML = ''; 

                if (histData.expenses && histData.expenses.length > 0) {
                    histData.expenses.forEach(exp => {
                        expensesList.innerHTML += `
                            <li class="list-group-item px-0 d-flex justify-content-between align-items-center">
                                ${exp.title} 
                                <span class="badge bg-primary rounded-pill" style="background-color: var(--budget-purple)!important;">
                                    Rs. ${exp.total_amount}
                                </span>
                            </li>
                        `;
                    });
                } else {
                    expensesList.innerHTML = `<li class="text-muted text-center py-3">No recent expenses found.</li>`;
                }

                if (dashboard.budget_status.exceeded_count > 0) {
                    document.getElementById('alert-message').innerText = `⚠️ You have exceeded ${dashboard.budget_status.exceeded_count} of your budgets!`;
                    document.getElementById('budget-alert').classList.remove('d-none');
                }

            } catch (error) {
                console.log('Error loading dynamic dashboard data:', error);
            }
        }

        window.onload = loadDashboardData;
    </script>
</body>
</html>

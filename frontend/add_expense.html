<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense - BudgetSense</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        :root {
            --budget-purple: #7047EB;       
            --budget-purple-hover: #5A35C5; 
            --budget-bg-light: #F8F9FA;     
            --text-muted-custom: #6c757d;
            --border-color: #e9ecef;
        }
        
        body {
            background-color: var(--budget-bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        /* Navbar Color */
        .navbar {
            background-color: var(--budget-purple) !important;
            box-shadow: 0 4px 12px rgba(112, 71, 235, 0.1);
        }

        /* Typography & Section Headers */
        .page-title { font-weight: 800; font-size: 2rem; letter-spacing: -0.5px; }
        .section-header { 
            font-size: 0.75rem; 
            font-weight: 700; 
            color: var(--text-muted-custom); 
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
            margin-top: 2.5rem; 
            margin-bottom: 1rem; 
        }

        /* Form Inputs */
        .form-label { font-size: 0.85rem; font-weight: 600; color: #495057; }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #ced4da;
            padding: 0.75rem 1rem;
            background-color: #ffffff;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--budget-purple);
            box-shadow: 0 0 0 0.25rem rgba(112, 71, 235, 0.25);
        }
        
        /* Dashed Button (Add Item) */
        .btn-dashed {
            border: 1px dashed #ced4da;
            color: var(--text-muted-custom);
            background-color: transparent;
            border-radius: 8px;
            padding: 0.75rem;
            width: 100%;
            text-align: left;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn-dashed:hover {
            border-color: var(--budget-purple);
            color: var(--budget-purple);
            background-color: #ffffff;
        }

        /* Upload Box */
        .upload-box {
            border: 2px dashed #ced4da;
            border-radius: 12px;
            padding: 3rem 1.5rem;
            text-align: center;
            background-color: #ffffff;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-box:hover {
            border-color: var(--budget-purple);
            background-color: #f8f6ff;
        }
        .upload-icon { font-size: 2rem; color: var(--budget-purple); margin-bottom: 10px; }

        /* Summary Card (Right Side) */
        .summary-card {
            background-color: #ffffff;
            border-radius: 16px;
            border: none;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
            padding: 2rem;
            position: sticky;
            top: 20px; /* Keeps it in view when scrolling */
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #495057;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }
        .summary-row:last-of-type { border-bottom: none; }
        .summary-value { font-weight: 600; color: #212529; }
        
        /* Purple Buttons */
        .btn-primary {
            background-color: var(--budget-purple);
            border-color: var(--budget-purple);
            border-radius: 8px;
            padding: 0.8rem;
        }
        .btn-primary:hover {
            background-color: var(--budget-purple-hover);
            border-color: var(--budget-purple-hover);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">BudgetSense</a>
            <div class="ms-auto">
                <a href="dashboard.html" class="text-white text-decoration-none small fw-bold">
                    <i class="bi bi-chevron-left"></i> Back to dashboard
                </a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row gx-5">
            
            <div class="col-lg-7 mb-4">
                <h1 class="page-title">Add expense</h1>
                <p class="text-muted">Log a new expense with optional receipt upload.</p>

                <form>
                    <div class="section-header">Basic Info</div>
                    
                    <div class="mb-4">
                        <label class="form-label">Title *</label>
                        <input type="text" class="form-control" placeholder="e.g. Grocery run, Uber ride..." required>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label class="form-label">Category *</label>
                            <select class="form-select" required>
                                <option value="" selected disabled>Select category</option>
                                <option>Food</option>
                                <option>Transport</option>
                                <option>Shopping</option>
                                <option>Bills</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date *</label>
                            <input type="date" class="form-control" value="2026-05-13" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control" rows="3" placeholder="Optional details..."></textarea>
                    </div>

                    <div class="section-header">Line Items</div>
                    
                    <div class="mb-4">
                        <button type="button" class="btn-dashed">
                            <i class="bi bi-plus-lg me-2"></i> Add item
                        </button>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Total amount * <span class="text-muted fw-normal">— auto-calculated from items, or enter manually</span></label>
                        <input type="number" class="form-control" placeholder="0.00" required>
                    </div>

                    <div class="section-header">Receipt</div>
                    
                    <div class="upload-box mb-4">
                        <i class="bi bi-image upload-icon"></i>
                        <p class="mb-1"><span class="fw-bold" style="color: var(--budget-purple);">Click to upload</span> or drag and drop</p>
                        <small class="text-muted">JPG, PNG, GIF, WEBP — max 16 MB</small>
                        <input type="file" class="form-control d-none" id="receiptUpload" accept="image/*">
                    </div>

                </form>
            </div>

            <div class="col-lg-5">
                <div class="summary-card">
                    <h5 class="fw-bold mb-4">Summary</h5>
                    
                    <div class="summary-row">
                        <span>Title</span>
                        <span class="summary-value">—</span>
                    </div>
                    <div class="summary-row">
                        <span>Category</span>
                        <span class="summary-value">—</span>
                    </div>
                    <div class="summary-row">
                        <span>Date</span>
                        <span class="summary-value">13 May 2026</span>
                    </div>
                    <div class="summary-row">
                        <span>Receipt</span>
                        <span class="summary-value">None</span>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mt-4 mb-4">
                        <span class="text-muted fw-bold">Total</span>
                        <h2 class="fw-bold mb-0" style="color: var(--budget-purple);">Rs 0.00</h2>
                    </div>

                    <button type="button" class="btn btn-primary w-100 fw-bold shadow-sm">Save expense</button>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.querySelector('.upload-box').addEventListener('click', function() {
            document.getElementById('receiptUpload').click();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BudgetSense</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --budget-purple: #7047EB;       /* Vibrant Purple */
            --budget-purple-hover: #5A35C5; /* Darker Purple for Hover */
            --budget-bg-light: #F8F9FA;     /* Soft Off-White Background */
        }
        
        body {
            background-color: var(--budget-bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Navbar Color */
        .navbar {
            background-color: var(--budget-purple) !important;
            box-shadow: 0 4px 12px rgba(112, 71, 235, 0.1);
        }

        /* Headings & Links */
        .text-primary {
            color: var(--budget-purple) !important;
        }

        /* Purple Buttons */
        .btn-primary {
            background-color: var(--budget-purple);
            border-color: var(--budget-purple);
        }
        .btn-primary:hover {
            background-color: var(--budget-purple-hover);
            border-color: var(--budget-purple-hover);
        }

        /* Form Card Styling */
        .card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }

        /* Input Field Focus */
        .form-control:focus {
            border-color: var(--budget-purple);
            box-shadow: 0 0 0 0.25rem rgba(112, 71, 235, 0.25);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">BudgetSense</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5">
                <div class="card p-2">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 fw-bold text-primary">Welcome Back</h3>
                        
                        <!-- FIX 1: Added id="login-form" -->
                        <form id="login-form">
                            <div class="mb-3">
                                <label class="form-label">Email address</label>
                                <!-- FIX 2: Added id="email" -->
                                <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <!-- FIX 3: Added id="password" -->
                                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                            </div>
                            <div class="d-grid">
                                <!-- FIX 4: Changed type to "submit" so the form can trigger the submit event listener -->
                                <button type="submit" class="btn btn-primary btn-lg">Login</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="text-muted">Don't have an account? <a href="/register" class="text-primary text-decoration-none fw-bold">Register here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault(); // Prevents default page reload behavior

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const url = '/api/auth/login'; 

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        email: email, 
                        password: password 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // FIX 5: Your backend auth route sends the token in data.auth.access_token.
                    // Storing both token and public user data to local storage for future API requests.
                    localStorage.setItem('access_token', data.auth.access_token);
                    localStorage.setItem('user_name', data.user.name);
                    localStorage.setItem('user_id', data.user._id || data.user.id); 
                    
                    // Redirect directly to your Flask dashboard route
                    window.location.href = '/dashboard';
                } else {
                    // Display the explicit custom error sent by your auth blueprint validation logic
                    alert(data.error || 'Invalid email or password. Please try again.');
                }

            } catch (error) {
                console.error('Login Error:', error);
                alert('Backend server se connect nahi ho saka. Make sure Flask is running!');
            }
        }

        // Binds the execution loop directly to the corrected form structure above
        document.getElementById('login-form').addEventListener('submit', handleLogin);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BudgetSense</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --budget-purple: #7047EB;       /* Vibrant Purple */
            --budget-purple-hover: #5A35C5; /* Darker Purple for Hover */
            --budget-bg-light: #F8F9FA;     /* Soft Off-White Background */
        }
        
        body {
            background-color: var(--budget-bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Navbar Color */
        .navbar {
            background-color: var(--budget-purple) !important;
            box-shadow: 0 4px 12px rgba(112, 71, 235, 0.1);
        }

        /* Headings & Links */
        .text-primary {
            color: var(--budget-purple) !important;
        }

        /* Purple Buttons */
        .btn-primary {
            background-color: var(--budget-purple);
            border-color: var(--budget-purple);
        }
        .btn-primary:hover {
            background-color: var(--budget-purple-hover);
            border-color: var(--budget-purple-hover);
        }

        /* Form Card Styling */
        .card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }

        /* Input Field Focus */
        .form-control:focus {
            border-color: var(--budget-purple);
            box-shadow: 0 0 0 0.25rem rgba(112, 71, 235, 0.25);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">BudgetSense</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5">
                <div class="card p-2">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 fw-bold text-primary">Welcome Back</h3>
                        
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Email address</label>
                                <input type="email" class="form-control" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" placeholder="••••••••" required>
                            </div>
                            <div class="d-grid">
                                <button type="button" class="btn btn-primary btn-lg">Login</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="text-muted">Don't have an account? <a href="/register" class="text-primary text-decoration-none fw-bold">Register here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
<script>
    async function handleLogin(event) {
        event.preventDefault(); // Page reload hone se rokta hai

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Exact matched URL based on Ifra's Blueprint Prefix
        const url = '/api/auth/login'; 

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    email: email, 
                    password: password 
                })
            });

            const data = await response.json();

            if (response.ok) {
                // User ID ko local storage mein save karna taake dashboard use kar sakay
                localStorage.setItem('user_id', data.user_id); 
                
                // Dashboard par redirect karna
                window.location.href = '/dashboard';
            } else {
                alert(data.message || 'Invalid email or password. Please try again.');
            }

        } catch (error) {
            console.error('Login Error:', error);
            alert('Backend server se connect nahi ho saka. Make sure Flask is running!');
        }
    }

    document.getElementById('login-form').addEventListener('submit', handleLogin);
</script>

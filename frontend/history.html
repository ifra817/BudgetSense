<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense History - BudgetSense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --budget-purple: #7047EB; --budget-purple-hover: #5A35C5; --budget-bg-light: #F8F9FA; }
        body { background-color: var(--budget-bg-light); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: var(--budget-purple) !important; box-shadow: 0 4px 12px rgba(112, 71, 235, 0.1); }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        .btn-primary { background-color: var(--budget-purple); border-color: var(--budget-purple); }
        .btn-primary:hover { background-color: var(--budget-purple-hover); border-color: var(--budget-purple-hover); }
        .badge-category { background-color: #e0d4fc; color: var(--budget-purple); font-weight: 600; }
        .btn-delete { color: #dc3545; background: none; border: none; padding: 0 8px; transition: opacity 0.2s; }
        .btn-delete:hover { opacity: 0.7; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">BudgetSense</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/history">History</a></li>
                    <li class="nav-item"><a class="nav-link" href="/budgets">Budgets</a></li>
                    <li class="nav-item ms-lg-3">
                        <a href="/login" class="btn btn-sm btn-outline-light px-3 fw-bold" style="border-radius: 20px;" onclick="localStorage.clear()">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold" style="color: #333;">Expense History</h3>
            <a href="/add_expense" class="btn btn-primary fw-bold">+ Add New</a>
        </div>

        <div class="card p-4 mb-4">
            <h5 class="fw-bold mb-3">Filter Transactions</h5>
            <form class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Category</label>
                    <select id="category-filter" class="form-select">
                        <option value="All Categories" selected>All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Groceries">Groceries</option>
                        <option value="Dining">Dining</option>
                        <option value="Transport">Transport</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Education">Education</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Sports">Sports</option>
                        <option value="Travel">Travel</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">From Date</label>
                    <input type="date" id="start-date" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">To Date</label>
                    <input type="date" id="end-date" class="form-control">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="button" id="apply-filters-btn" class="btn btn-primary w-100 fw-bold">Apply Filters</button>
                </div>
            </form>
        </div>

        <div class="card p-0 overflow-hidden mb-5">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="px-4 py-3">Date</th>
                            <th class="py-3">Title</th>
                            <th class="py-3">Category</th>
                            <th class="text-end px-4 py-3">Amount (Rs.)</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body">
                        <tr>
                            <td colspan="4" class="text-center py-4 text-muted">Loading transactions...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchFilteredHistory() {
            const userId = localStorage.getItem('user_id');
            if (!userId) { window.location.href = '/login'; return; }

            const category = document.getElementById('category-filter').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            
            let url = `/api/analytics/history?user_id=${userId}&per_page=50`;
            if (category && category !== "All Categories") url += `&category=${category}`;
            if (startDate) url += `&start_date=${startDate}`;
            if (endDate) url += `&end_date=${endDate}`;

            try {
                const response = await fetch(url);
                if (!response.ok) return; 

                const data = await response.json();
                const expenses = data.expenses; 
                const tableBody = document.getElementById('history-table-body');
                
                tableBody.innerHTML = ''; 

                if (!expenses || expenses.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted">No expenses found.</td></tr>`;
                    return;
                }

                expenses.forEach(exp => {
                    const formattedAmount = Number(exp.total_amount).toLocaleString();
                    const dateOnly = exp.date ? exp.date.substring(0, 10) : 'N/A';
                    
                    tableBody.innerHTML += `
                        <tr>
                            <td class="px-4 py-3 text-muted align-middle">${dateOnly}</td>
                            <td class="py-3 fw-bold align-middle">${exp.title}</td>
                            <td class="py-3 align-middle"><span class="badge badge-category rounded-pill px-3 py-2">${exp.category}</span></td>
                            <td class="text-end px-4 py-3 fw-bold align-middle">
                                ${formattedAmount}
                                <button class="btn-delete ms-3" onclick="deleteExpense('${exp._id}')" title="Delete">🗑️</button>
                            </td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.log("Error fetching live history data:", error);
            }
        }

        async function deleteExpense(expenseId) {
            if (!confirm("Are you sure you want to delete this expense? This cannot be undone.")) return;
            
            const userId = localStorage.getItem('user_id');
            try {
                const response = await fetch(`/api/expenses/${expenseId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });

                if (response.ok) {
                    fetchFilteredHistory(); // Refresh table immediately
                } else {
                    const data = await response.json();
                    alert(data.error || "Failed to delete expense.");
                }
            } catch (error) {
                console.error("Error deleting expense:", error);
                alert("Server error while deleting.");
            }
        }

        document.getElementById('apply-filters-btn').addEventListener('click', fetchFilteredHistory);
        window.onload = fetchFilteredHistory;
    </script>
</body>
</html>

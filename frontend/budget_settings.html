<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Settings - BudgetSense</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --budget-purple: #7047EB;       
            --budget-purple-hover: #5A35C5; 
            --budget-bg-light: #F8F9FA;     
        }
        
        body {
            background-color: var(--budget-bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background-color: var(--budget-purple) !important;
            box-shadow: 0 4px 12px rgba(112, 71, 235, 0.1);
        }

        .card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .btn-primary {
            background-color: var(--budget-purple);
            border-color: var(--budget-purple);
        }
        .btn-primary:hover {
            background-color: var(--budget-purple-hover);
            border-color: var(--budget-purple-hover);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--budget-purple);
            box-shadow: 0 0 0 0.25rem rgba(112, 71, 235, 0.25);
        }

        .budget-icon {
            font-size: 1.5rem;
            color: var(--budget-purple);
            margin-right: 15px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">BudgetSense</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
                    <li class="nav-item"><a class="nav-link active" href="budget_settings.html">Budgets</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h3 class="fw-bold mb-4" style="color: #333;">Budget Settings</h3>

        <div class="row">
            <div class="col-md-5 mb-4">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3">Monthly Income</h5>
                    <p class="text-muted small">Set your total income to calculate remaining balance.</p>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Total Monthly Income (Rs.)</label>
                            <input type="number" class="form-control form-control-lg" placeholder="e.g. 80000" value="80000">
                        </div>
                        <button type="button" class="btn btn-primary w-100 fw-bold">Update Income</button>
                    </form>
                </div>
            </div>

            <div class="col-md-7 mb-4">
                <div class="card p-4">
                    <h5 class="fw-bold mb-4">Category Limits</h5>
                    
                    <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                        <div class="d-flex align-items-center">
                            <div class="budget-icon">🍔</div>
                            <div>
                                <h6 class="mb-0 fw-bold">Food & Dining</h6>
                                <small class="text-muted">Limit: Rs. 15,000</small>
                            </div>
                        </div>
                        <button class="btn btn-outline-primary btn-sm px-3">Edit</button>
                    </div>

                    <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                        <div class="d-flex align-items-center">
                            <div class="budget-icon">🚗</div>
                            <div>
                                <h6 class="mb-0 fw-bold">Transport</h6>
                                <small class="text-muted">Limit: Rs. 5,000</small>
                            </div>
                        </div>
                        <button class="btn btn-outline-primary btn-sm px-3">Edit</button>
                    </div>

                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <div class="d-flex align-items-center">
                            <div class="budget-icon">🛍️</div>
                            <div>
                                <h6 class="mb-0 fw-bold">Shopping</h6>
                                <small class="text-muted">Limit: Rs. 10,000</small>
                            </div>
                        </div>
                        <button class="btn btn-outline-primary btn-sm px-3">Edit</button>
                    </div>

                    <div class="mt-4">
                        <button class="btn btn-primary w-100 fw-bold">+ Add New Category Budget</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BudgetSense</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --budget-purple: #7047EB;       
            --budget-purple-hover: #5A35C5; 
            --budget-bg-light: #F8F9FA;     
        }
        
        body {
            background-color: var(--budget-bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background-color: var(--budget-purple) !important;
            box-shadow: 0 4px 12px rgba(112, 71, 235, 0.1);
        }

        .text-primary {
            color: var(--budget-purple) !important;
        }

        .btn-primary {
            background-color: var(--budget-purple);
            border-color: var(--budget-purple);
        }
        .btn-primary:hover {
            background-color: var(--budget-purple-hover);
            border-color: var(--budget-purple-hover);
        }

        .card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }

        .form-control:focus {
            border-color: var(--budget-purple);
            box-shadow: 0 0 0 0.25rem rgba(112, 71, 235, 0.25);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">BudgetSense</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center mt-4">
            <div class="col-md-6">
                <div class="card p-2">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 fw-bold text-primary">Create Account</h3>
                        
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" placeholder="e.g. Haleema Zafar" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email address</label>
                                <input type="email" class="form-control" placeholder="name@example.com" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" placeholder="Create a strong password" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" placeholder="Repeat password" required>
                            </div>

                            <div class="d-grid">
                                <button type="button" class="btn btn-primary btn-lg fw-bold">Sign Up</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="text-muted">Already have an account? <a href="login.html" class="text-primary text-decoration-none fw-bold">Login here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
